services:
  support_bot:
    env_file:                # Указываем файл с переменными окружения
      - .env
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support_bot
    networks:
      - redis_network
    volumes:
      - ./logs:/app/logs
    depends_on: 
      redis:
        condition: service_healthy

  redis:
    env_file:
    - .env
    image: redis:8
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - redis_network
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

volumes:
  redisdata:

networks:
  redis_network:
    driver: bridge